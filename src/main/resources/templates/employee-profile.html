<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>My Profile | WorkSphere</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background:#f5f7fb;
}

.profile-card{

    max-width:900px;

    margin:auto;

    margin-top:50px;

    border-radius:20px;

    box-shadow:0 15px 35px rgba(0,0,0,.15);

    overflow:hidden;

}

.header{

    background:#0d6efd;

    color:white;

    padding:30px;

    text-align:center;

}

.profile-img{

    width:120px;

    height:120px;

    border-radius:50%;

    background:white;

    margin:auto;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:60px;

    color:#0d6efd;

}

.table td{

    padding:15px;

}

</style>

</head>

<body>

<div class="profile-card bg-white">

<div class="header">

<div class="profile-img">

<i class="bi bi-person-fill"></i>

</div>

<h2 class="mt-3"
th:text="${employee.firstName+' '+employee.lastName}">
</h2>

<p th:text="${employee.role}">
</p>

</div>

<div class="p-4">

<table class="table table-bordered">

<tr>

<th>Email</th>

<td th:text="${employee.email}"></td>

</tr>

<tr>

<th>Phone</th>

<td th:text="${employee.phone}"></td>

</tr>

<tr>

    <th>Address</th>

    <td th:text="${employee.address}"></td>

</tr>

<tr>

<th>Department</th>

<td th:text="${employee.department}"></td>

</tr>

<tr>

<th>Salary</th>

<td th:text="${employee.salary}"></td>

</tr>

<tr>

<th>Joining Date</th>

<td th:text="${employee.joiningDate}"></td>

</tr>

<tr>

<th>Username</th>

<td th:text="${employee.username}"></td>

</tr>

<tr>

<th>Status</th>

<td>

<span class="badge bg-success"
th:text="${employee.status}">
</span>

</td>

</tr>

</table>

<div class="text-center">

<a th:href="@{/employee/editProfile}"
   class="btn btn-primary">
    Edit Profile
</a>

<a th:href="@{/employee/changePassword}"
class="btn btn-warning">

Change Password

</a>

<a th:href="@{/employee/dashboard}"
class="btn btn-secondary">

Back

</a>

</div>

</div>

</div>

</body>

</html>
