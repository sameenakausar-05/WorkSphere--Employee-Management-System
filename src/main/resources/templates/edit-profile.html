<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">

<title>Edit Profile | WorkSphere</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body style="background:#f4f7fc;">

<div class="container mt-5">

<div class="card shadow-lg p-4">

<h2 class="mb-4 text-primary">

Edit Profile

</h2>

<form th:action="@{/employee/updateProfile}"
      th:object="${employee}"
      method="post">

<input type="hidden" th:field="*{id}">

<div class="mb-3">

<label>Email</label>

<input type="email"
       class="form-control"
       th:field="*{email}">

</div>

<div class="mb-3">

<label>Phone</label>

<input type="text"
       class="form-control"
       th:field="*{phone}">

</div>

<div class="mb-3">

<label>Address</label>

<textarea class="form-control"
          th:field="*{address}">
</textarea>

</div>

<button class="btn btn-success">

Update Profile

</button>

<a th:href="@{/employee/profile}"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</body>
</html>
