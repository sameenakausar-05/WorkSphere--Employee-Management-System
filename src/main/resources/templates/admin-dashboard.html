<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Admin Dashboard | WorkSphere</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background:#f4f7fc;
    font-family:Segoe UI,sans-serif;
}

.topbar{
    background:linear-gradient(135deg,#2563eb,#1e40af);
    color:white;
    border-radius:18px;
    padding:30px;
    margin-bottom:30px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.stat-card{
    border:none;
    border-radius:18px;
    transition:.3s;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.stat-card:hover{
    transform:translateY(-6px);
}

.icon-box{
    width:65px;
    height:65px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    color:white;
    margin:auto;
    margin-bottom:15px;
}

.blue{
    background:#2563eb;
}

.green{
    background:#16a34a;
}

.orange{
    background:#f59e0b;
}

.red{
    background:#dc2626;
}

.action-card{
    border:none;
    border-radius:18px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.action-btn{
    padding:15px;
    font-size:17px;
    border-radius:12px;
}

.table-card{
    border:none;
    border-radius:18px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

</style>

</head>

<body>

<div class="container py-4">

<div class="topbar">

<h2 class="fw-bold">

Welcome,
<span th:text="${employee.firstName}"></span> 👋

</h2>

<p class="mb-0 fs-5">
Administrator Dashboard
</p>

</div>

<div class="row g-4">

<div class="col-md-3">

<div class="card stat-card">

<div class="card-body text-center">

<div class="icon-box blue">
<i class="bi bi-people-fill"></i>
</div>

<h2 class="fw-bold text-primary"
th:text="${totalEmployees}">
</h2>

<p class="text-muted mb-0">
Total Employees
</p>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card stat-card">

<div class="card-body text-center">

<div class="icon-box green">
<i class="bi bi-person-check-fill"></i>
</div>

<h2 class="fw-bold text-success"
th:text="${activeEmployees}">
</h2>

<p class="text-muted mb-0">
Active Employees
</p>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card stat-card">

<div class="card-body text-center">

<div class="icon-box orange">
<i class="bi bi-building"></i>
</div>

<h2 class="fw-bold text-warning"
th:text="${departmentCount}">
</h2>

<p class="text-muted mb-0">
Departments
</p>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card stat-card">

<div class="card-body text-center">

<div class="icon-box red">
<i class="bi bi-calendar-event-fill"></i>
</div>

<h2 class="fw-bold text-danger"
th:text="${pendingLeaves}">
</h2>

<p class="text-muted mb-0">
Pending Leaves
</p>

</div>

</div>

</div>

</div>

<div class="row mt-4 g-4">

<div class="col-lg-4">

<div class="card action-card">

<div class="card-header bg-dark text-white rounded-top">

<h5 class="mb-0">
Quick Actions
</h5>

</div>

<div class="card-body d-grid gap-3">

<a th:href="@{/admin/addEmployee}"
class="btn btn-success action-btn">

<i class="bi bi-person-plus-fill"></i>
Add Employee

</a>

<a th:href="@{/admin/employees}"
class="btn btn-primary action-btn">

<i class="bi bi-people-fill"></i>
View Employees

</a>

<a th:href="@{/admin/manageLeaves}"
class="btn btn-warning action-btn">

<i class="bi bi-calendar2-check-fill"></i>
Manage Leaves

</a>

<a th:href="@{/logout}"
class="btn btn-danger action-btn">

<i class="bi bi-box-arrow-right"></i>
Logout

</a>

</div>

</div>

</div>

<div class="col-lg-8">

<div class="card table-card">

<div class="card-header bg-primary text-white rounded-top">

<h5 class="mb-0">
System Overview
</h5>

</div>

<div class="card-body">

<table class="table table-hover align-middle">

<tr>

<th>Total Employees</th>

<td class="fw-bold"
th:text="${totalEmployees}">
</td>

</tr>

<tr>

<th>Active Employees</th>

<td class="fw-bold text-success"
th:text="${activeEmployees}">
</td>

</tr>

<tr>

<th>Departments</th>

<td class="fw-bold text-warning"
th:text="${departmentCount}">
</td>

</tr>

<tr>

<th>Pending Leaves</th>

<td>

<span class="badge bg-danger fs-6"
th:text="${pendingLeaves}">
</span>

</td>

</tr>

</table>

</div>

</div>

</div>

</div>

</div>

<!-- Dashboard Analytics -->

<div class="container mt-5">

    <div class="row g-4">

        <!-- Department Chart -->

        <div class="col-lg-6">

            <div class="card shadow border-0 rounded-4 h-100">

                <div class="card-header bg-success text-white">

                    <h5 class="mb-0">
                        <i class="bi bi-bar-chart-fill"></i>
                        Employees by Department
                    </h5>

                </div>

                <div class="card-body">

                    <canvas id="departmentChart"
                            style="max-height:300px;">
                    </canvas>

                </div>

            </div>

        </div>

        <!-- Leave Chart -->

        <div class="col-lg-6">

            <div class="card shadow border-0 rounded-4 h-100">

                <div class="card-header bg-info text-white">

                    <h5 class="mb-0">
                        <i class="bi bi-pie-chart-fill"></i>
                        Leave Statistics
                    </h5>

                </div>

                <div class="card-body">

                    <canvas id="leaveChart"
                            style="max-height:300px;">
                    </canvas>

                </div>

            </div>

        </div>

    </div>

</div>

<input type="hidden" id="hrCount" th:value="${hrCount}">
<input type="hidden" id="financeCount" th:value="${financeCount}">
<input type="hidden" id="itCount" th:value="${itCount}">
<input type="hidden" id="salesCount" th:value="${salesCount}">
<input type="hidden" id="marketingCount" th:value="${marketingCount}">

<input type="hidden" id="pendingCount" th:value="${pendingCount}">
<input type="hidden" id="approvedCount" th:value="${approvedCount}">
<input type="hidden" id="rejectedCount" th:value="${rejectedCount}">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

const hr = Number(document.getElementById("hrCount").value);
const finance = Number(document.getElementById("financeCount").value);
const it = Number(document.getElementById("itCount").value);
const sales = Number(document.getElementById("salesCount").value);
const marketing = Number(document.getElementById("marketingCount").value);

const pending = Number(document.getElementById("pendingCount").value);
const approved = Number(document.getElementById("approvedCount").value);
const rejected = Number(document.getElementById("rejectedCount").value);

new Chart(document.getElementById("departmentChart"), {

    type: "bar",

    data: {

        labels: ["HR", "Finance", "IT", "Sales", "Marketing"],

        datasets:[{

        	label:"Employees",

        	data:[hr,finance,it,sales,marketing],

        	backgroundColor:[
        	"#2563eb",
        	"#16a34a",
        	"#f59e0b",
        	"#dc2626",
        	"#7c3aed"
        	],

        	borderRadius:10,

        	maxBarThickness:45

        	}]

    },

    options:{

    	responsive:true,

    	maintainAspectRatio:false,

    	plugins:{
    	legend:{
    	display:false
    	}
    	},

    	scales:{
    	y:{
    	beginAtZero:true,
    	ticks:{
    	stepSize:1
    	}
    	}
    	}

    	}

});

new Chart(document.getElementById("leaveChart"), {

    type: "doughnut",

    data: {

        labels: ["Pending", "Approved", "Rejected"],

        datasets:[{

        	data:[pending,approved,rejected],

        	backgroundColor:[
        	"#f59e0b",
        	"#16a34a",
        	"#dc2626"
        	],

        	hoverOffset:10

        	}]

    },

    options:{

    	responsive:true,

    	maintainAspectRatio:false,

    	cutout:'65%',

    	plugins:{
    	legend:{
    	position:'bottom'
    	}
    	}

    	}

});

</script>
</body>
</html>
