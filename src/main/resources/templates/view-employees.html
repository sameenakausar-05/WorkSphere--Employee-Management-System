<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Employees | WorkSphere</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<div class="d-flex justify-content-between align-items-center mb-4">

    <h2>Employees</h2>

   <form th:action="@{/admin/search}" method="get" class="d-flex">

    <input type="text"
           name="keyword"
           class="form-control me-2"
           placeholder="Search Employees">

    <button class="btn btn-primary me-2">
        Search
    </button>

    <a th:href="@{/admin/employees}"
       class="btn btn-secondary">
        Reset
    </a>

</form>

</div>

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>ID</th>

<th>Name</th>

<th>Email</th>

<th>Phone</th>

<th>Department</th>

<th>Salary</th>

<th>Joining Date</th>

<th>Role</th>

<th>Status</th>

<th>Actions</th>

</tr>

</thead>

<tbody>

<tr th:each="emp, empStat : ${employees}">

<td th:text="${empStat.count}"></td>
    <td th:text="${emp.firstName + ' ' + emp.lastName}"></td>
    <td th:text="${emp.email}"></td>
    <td th:text="${emp.phone}"></td>
    <td th:text="${emp.department}"></td>
    <td th:text="${emp.salary}"></td>
    <td th:text="${emp.joiningDate}"></td>
    <td th:text="${emp.role}"></td>
    <td th:text="${emp.status}"></td>

<td>

<a th:href="@{/admin/editEmployee/{id}(id=${emp.id})}"
   class="btn btn-warning btn-sm">

    Edit

</a>

<a href="#"
   class="btn btn-danger btn-sm"
   data-bs-toggle="modal"
   data-bs-target="#deleteModal"
   th:data-id="${emp.id}"
   th:data-name="${emp.firstName + ' ' + emp.lastName}">
    Delete
</a>

<a th:href="@{/admin/employeeDetails/{id}(id=${emp.id})}"
   class="btn btn-info btn-sm">
    <i class="bi bi-eye-fill"></i> View
</a>

</td>

</tr>

</tbody>

</table>

</div>

<!-- Delete Employee Modal -->

<div class="modal fade"
     id="deleteModal"
     tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content rounded-4 border-0 shadow-lg">

            <div class="modal-header border-0">

                <h4 class="modal-title text-danger">
                    ⚠ Delete Employee
                </h4>

            </div>

            <div class="modal-body text-center">

                <h5 id="employeeName"></h5>

                <p class="text-muted mt-3">
                    This action cannot be undone.
                </p>

            </div>

            <div class="modal-footer border-0">

                <button class="btn btn-secondary"
                        data-bs-dismiss="modal">
                    Cancel
                </button>

                <a id="deleteBtn"
                   class="btn btn-danger">

                    Delete

                </a>

            </div>

        </div>

    </div>

</div>

<script>

const deleteModal =
document.getElementById('deleteModal');

deleteModal.addEventListener('show.bs.modal', function(event){

    const button = event.relatedTarget;

    const id = button.getAttribute('data-id');

    const name = button.getAttribute('data-name');

    document.getElementById("employeeName").innerHTML =
        "Delete <b>" + name + "</b>?";

    document.getElementById("deleteBtn").href =
        "/admin/deleteEmployee/" + id;

});

</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
