<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Search Employees | WorkSphere</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f7fc;
}

.search-card{
    margin-top:60px;
    border:none;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

</style>

</head>

<body>

<div class="container">

<div class="card search-card">

<div class="card-body p-5">

<h2 class="mb-4 text-primary">
🔍 Search Employees
</h2>

<form th:action="@{/admin/search}" method="get">

    <input type="text"
           name="keyword"
           class="form-control"
           placeholder="Search by Name, Email, Department or Username">

    <button type="submit"
            class="btn btn-primary">
        Search
    </button>

</form>

<div class="mt-4">

<a th:href="@{/admin/dashboard}"
class="btn btn-secondary">

← Back to Dashboard

</a>

</div>

</div>

</div>

</div>

</body>

</html>
