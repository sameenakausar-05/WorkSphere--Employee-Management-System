<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Leave Requests | WorkSphere</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-dark text-white">

<h3>🍃 Leave Requests</h3>

</div>

<div class="card-body">

<div class="table-responsive">

<table class="table table-hover table-bordered align-middle text-center">

<thead class="table-primary">

<tr>

<th>ID</th>

<th>Employee</th>

<th>Leave Type</th>

<th>Start Date</th>

<th>End Date</th>

<th>Reason</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody>

<tr th:each="leave : ${leaves}">

<td th:text="${leave.id}"></td>

<td th:text="${leave.employee.firstName + ' ' + leave.employee.lastName}"></td>

<td th:text="${leave.leaveType}"></td>

<td th:text="${leave.startDate}"></td>

<td th:text="${leave.endDate}"></td>

<td th:text="${leave.reason}"></td>

<td>

<span th:if="${leave.status=='PENDING'}"
      class="badge bg-warning text-dark">
    Pending
</span>

<span th:if="${leave.status=='APPROVED'}"
      class="badge bg-success">
    Approved
</span>

<span th:if="${leave.status=='REJECTED'}"
      class="badge bg-danger">
    Rejected
</span>

</td>

<td>

<a th:if="${leave.status=='PENDING'}"
   th:href="@{/admin/approveLeave/{id}(id=${leave.id})}"
   class="btn btn-success btn-sm">

Approve

</a>

<a th:if="${leave.status=='PENDING'}"
   th:href="@{/admin/rejectLeave/{id}(id=${leave.id})}"
   class="btn btn-danger btn-sm">

Reject

</a>

</td>

</tr>

</tbody>

</table>

<a th:href="@{/admin/dashboard}"
   class="btn btn-secondary">

← Back to Dashboard

</a>

</div>

</div>

</div>

</body>

</html>
