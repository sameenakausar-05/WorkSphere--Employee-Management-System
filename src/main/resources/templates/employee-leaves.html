<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>My Leave History | WorkSphere</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3>📅 My Leave History</h3>

</div>

<div class="card-body">

<div class="table-responsive">

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>Leave Type</th>

<th>Start Date</th>

<th>End Date</th>

<th>Reason</th>

<th>Status</th>

</tr>

</thead>

<tbody>

<tr th:each="leave : ${leaves}">

<td th:text="${leave.leaveType}"></td>

<td th:text="${leave.startDate}"></td>

<td th:text="${leave.endDate}"></td>

<td th:text="${leave.reason}"></td>

<td>

<span class="badge bg-warning text-dark"
      th:if="${leave.status=='PENDING'}">
    Pending
</span>

<span class="badge bg-success"
      th:if="${leave.status=='APPROVED'}">
    Approved
</span>

<span class="badge bg-danger"
      th:if="${leave.status=='REJECTED'}">
    Rejected
</span>

</td>

</tr>

</tbody>

</table>

</div>

<a th:href="@{/employee/dashboard}"
   class="btn btn-secondary">

← Back to Dashboard

</a>

</div>

</div>

</div>

</body>

</html>
