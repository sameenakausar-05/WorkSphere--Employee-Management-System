<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">

<title>Employee Dashboard | WorkSphere</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background:#f4f7fc;
}

.card{
    border:none;
    border-radius:15px;
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.profile-card{
    background:white;
    border-radius:15px;
    padding:25px;
}

.top-bar{
    background:#0d6efd;
    color:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:30px;
}

.action-icon{
    font-size:40px;
    color:#0d6efd;
}

</style>

</head>

<body>

<div class="container mt-5">

<div class="top-bar">

<h2>
Welcome,
<span th:text="${employee.firstName}"></span>
👋
</h2>

<p class="mb-0">
Employee Dashboard
</p>

</div>

<div class="row g-4">

<div class="col-md-4">

<a th:href="@{/employee/profile}" style="text-decoration:none;">

<div class="card p-4 text-center">

<i class="bi bi-person-circle action-icon"></i>

<h4 class="mt-3">My Profile</h4>

<p>View and update your personal information.</p>

</div>

</a>

</div>

<div class="col-md-4">

<div class="card p-4 text-center">

<i class="bi bi-calendar-check action-icon"></i>

<h4 class="mt-3">Attendance</h4>

<p>Check In / Check Out</p>

</div>

</div>

<div class="col-md-4">

<a th:href="@{/employee/applyLeave}"
   style="text-decoration:none; color:inherit;">

<div class="card p-4 text-center">

<i class="bi bi-calendar2-week action-icon"></i>

<h4 class="mt-3">Leave Management</h4>

<p>Apply and track leave requests.</p>

</div>

</a>

</div>

</div>

<div class="profile-card mt-5">

<h4 class="mb-4">
Personal Information
</h4>

<table class="table">

<tr>

<th>Name</th>

<td th:text="${employee.firstName+' '+employee.lastName}"></td>

</tr>

<tr>

<th>Email</th>

<td th:text="${employee.email}"></td>

</tr>

<tr>

<th>Department</th>

<td th:text="${employee.department}"></td>

</tr>

<tr>

<th>Status</th>

<td>

<span class="badge bg-success"
      th:text="${employee.status}">
</span>

</td>

</tr>

</table>
<div class="d-flex flex-wrap gap-3 mt-4">

    <a th:href="@{/employee/applyLeave}"
       class="btn btn-primary">
        📝 Apply Leave
    </a>

    <a th:href="@{/employee/myLeaves}"
       class="btn btn-success">
        📋 My Leaves
    </a>

    <a th:href="@{/employee/changePassword}"
       class="btn btn-warning">
        🔒 Change Password
    </a>

    <a th:href="@{/logout}"
       class="btn btn-danger ms-auto">
        🚪 Logout
    </a>

</div>

</div>

</div>

</body>

</html>
