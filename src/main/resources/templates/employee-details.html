<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Employee Details | WorkSphere</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background:#f4f7fc;
    font-family:Segoe UI,sans-serif;
}

.profile-card{
    max-width:900px;
    margin:40px auto;
    border:none;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 12px 30px rgba(0,0,0,.12);
}

.profile-header{
    background:linear-gradient(135deg,#2563eb,#1e40af);
    color:white;
    text-align:center;
    padding:35px;
}

.profile-header i{
    font-size:90px;
}

.table td,
.table th{
    padding:15px;
    vertical-align:middle;
}

.info-title{
    font-weight:600;
    color:#555;
    width:35%;
}

</style>

</head>

<body>

<div class="container">

<div class="card profile-card">

<div class="profile-header">

<i class="bi bi-person-circle"></i>

<h2 class="mt-3"
    th:text="${employee.firstName+' '+employee.lastName}">
</h2>

<p class="mb-0"
   th:text="${employee.department}">
</p>

</div>

<div class="card-body p-4">

<h4 class="mb-4">
Employee Information
</h4>

<table class="table table-bordered">

<tr>
<th class="info-title">Employee ID</th>
<td th:text="${employee.id}"></td>
</tr>

<tr>
<th class="info-title">First Name</th>
<td th:text="${employee.firstName}"></td>
</tr>

<tr>
<th class="info-title">Last Name</th>
<td th:text="${employee.lastName}"></td>
</tr>

<tr>
<th class="info-title">Username</th>
<td th:text="${employee.username}"></td>
</tr>

<tr>
<th class="info-title">Email</th>
<td th:text="${employee.email}"></td>
</tr>

<tr>
<th class="info-title">Department</th>
<td th:text="${employee.department}"></td>
</tr>

<tr>
<th class="info-title">Address</th>
<td th:text="${employee.address}"></td>
</tr>

<tr>
<th class="info-title">Status</th>

<td>

<span class="badge bg-success fs-6"
      th:if="${employee.status=='ACTIVE'}">
ACTIVE
</span>

<span class="badge bg-danger fs-6"
      th:if="${employee.status!='ACTIVE'}">
INACTIVE
</span>

</td>

</tr>

</table>

<div class="d-flex justify-content-between mt-4">

<a th:href="@{/admin/employees}"
   class="btn btn-secondary">

<i class="bi bi-arrow-left"></i>
Back

</a>

<a th:href="@{/admin/editEmployee/{id}(id=${employee.id})}"
   class="btn btn-primary">

<i class="bi bi-pencil-square"></i>
Edit Employee

</a>

</div>

</div>

</div>

</div>

</body>

</html>
